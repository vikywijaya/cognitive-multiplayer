<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220">
  <!-- Background -->
  <rect width="480" height="220" fill="#0d1b2e"/>

  <!-- TV screen frame -->
  <rect x="30" y="18" width="240" height="160" rx="12" fill="#1a2a40" stroke="#3a5a80" stroke-width="3"/>
  <rect x="38" y="26" width="224" height="144" rx="8" fill="#0a2040"/>

  <!-- Bingo card on TV screen -->
  <rect x="50" y="33" width="200" height="130" rx="6" fill="#0f2d4a"/>

  <!-- Header BINGO -->
  <rect x="50" y="33" width="200" height="26" rx="6" fill="#2255cc"/>
  <rect x="50" y="47" width="200" height="12" fill="#2255cc"/>
  <g font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="14" fill="white" text-anchor="middle">
    <text x="90"  y="51">B</text>
    <text x="130" y="51">I</text>
    <text x="150" y="51">N</text>
    <text x="170" y="51">G</text>
    <text x="210" y="51" dy="-2">O</text>
  </g>

  <!-- Grid numbers -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#aaddff" text-anchor="middle">
    <text x="70"  y="78">5</text>  <text x="110" y="78">18</text> <text x="150" y="78">32</text> <text x="190" y="78">50</text> <text x="230" y="78">64</text>
    <text x="70"  y="101">12</text> <text x="110" y="101">25</text> <text x="150" y="101">40</text> <text x="190" y="101">57</text> <text x="230" y="101">71</text>
    <text x="70"  y="124">8</text>  <text x="110" y="124">29</text>                                  <text x="190" y="124">53</text> <text x="230" y="124">68</text>
    <text x="70"  y="147">15</text> <text x="110" y="147">21</text> <text x="150" y="147">44</text> <text x="190" y="147">60</text> <text x="230" y="147">75</text>
  </g>

  <!-- FREE cell centre -->
  <rect x="132" y="113" width="36" height="24" rx="4" fill="#2255cc"/>
  <text x="150" y="129" text-anchor="middle" font-family="Helvetica" font-size="9" font-weight="bold" fill="white">FREE</text>

  <!-- Marked cells (daubs) -->
  <circle cx="70"  cy="74"  r="12" fill="#c0392b" opacity="0.85"/>
  <text x="70"  y="78" text-anchor="middle" font-family="Helvetica" font-size="11" font-weight="bold" fill="white">5</text>
  <circle cx="110" cy="97"  r="12" fill="#c0392b" opacity="0.85"/>
  <text x="110" y="101" text-anchor="middle" font-family="Helvetica" font-size="11" font-weight="bold" fill="white">25</text>
  <circle cx="190" cy="120" r="12" fill="#c0392b" opacity="0.85"/>
  <text x="190" y="124" text-anchor="middle" font-family="Helvetica" font-size="11" font-weight="bold" fill="white">53</text>
  <circle cx="230" cy="143" r="12" fill="#c0392b" opacity="0.85"/>
  <text x="230" y="147" text-anchor="middle" font-family="Helvetica" font-size="11" font-weight="bold" fill="white">75</text>

  <!-- TV stand -->
  <rect x="118" y="178" width="24" height="14" rx="2" fill="#3a5a80"/>
  <rect x="100" y="190" width="60" height="8" rx="4" fill="#3a5a80"/>

  <!-- Phone with QR code -->
  <rect x="255" y="55" width="38" height="72" rx="6" fill="#1a2a40" stroke="#3a5a80" stroke-width="2"/>
  <rect x="259" y="61" width="30" height="54" rx="3" fill="#0a2040"/>
  <!-- QR code simplified -->
  <rect x="263" y="65" width="22" height="22" rx="2" fill="white"/>
  <rect x="265" y="67" width="6" height="6" fill="#111"/>
  <rect x="277" y="67" width="6" height="6" fill="#111"/>
  <rect x="265" y="79" width="6" height="6" fill="#111"/>
  <rect x="271" y="71" width="2" height="2" fill="#111"/>
  <rect x="273" y="75" width="2" height="2" fill="#111"/>
  <rect x="277" y="79" width="6" height="6" fill="#111"/>
  <text x="274" y="100" text-anchor="middle" font-family="Helvetica" font-size="7" fill="#aaddff">SCAN</text>
  <text x="274" y="109" text-anchor="middle" font-family="Helvetica" font-size="7" fill="#aaddff">TO JOIN</text>
  <rect x="265" y="118" width="18" height="5" rx="2.5" fill="#3a5a80"/>

  <!-- Right decorative panel -->
  <rect x="296" y="20" width="154" height="180" rx="8" fill="#ffffff" opacity="0.04"/>

  <!-- BINGO! text -->
  <text x="373" y="90" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffd700" opacity="0.9">BINGO!</text>

  <!-- Number balls -->
  <circle cx="328" cy="130" r="18" fill="#2255cc"/>
  <text x="328" y="135" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="bold" fill="white">B5</text>

  <circle cx="373" cy="148" r="18" fill="#c0392b"/>
  <text x="373" y="153" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="bold" fill="white">G53</text>

  <circle cx="418" cy="130" r="18" fill="#1a7a1a"/>
  <text x="418" y="135" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="bold" fill="white">O75</text>

  <!-- Title badge -->
  <rect x="305" y="185" width="140" height="22" rx="11" fill="#2255cc"/>
  <text x="375" y="200" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="white">TV BINGO</text>
</svg>
