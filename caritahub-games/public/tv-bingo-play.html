<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <title>CaritaHub Bingo</title>
  <style>
    /* ── Mobile Bingo Player — Senior-Accessible ── */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      -webkit-text-size-adjust: 100%;
    }

    .screen { display: none; min-height: 100vh; }
    .screen.active { display: flex; flex-direction: column; }

    /* ── Join Screen ── */
    .join-screen {
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      gap: 20px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
    }

    .join-title {
      font-size: 32px;
      font-weight: 800;
      text-align: center;
    }

    .join-subtitle {
      font-size: 18px;
      color: #aab;
      text-align: center;
    }

    .join-input {
      width: 100%;
      max-width: 400px;
      font-size: 24px;
      padding: 16px 20px;
      border: 3px solid #4ecca3;
      border-radius: 12px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      text-align: center;
      outline: none;
    }
    .join-input::placeholder { color: #889; }
    .join-input:focus { border-color: #ffd700; background: rgba(255,255,255,0.15); }

    .join-btn {
      width: 100%;
      max-width: 400px;
      font-size: 22px;
      font-weight: 700;
      padding: 18px;
      background: #4ecca3;
      color: #1a1a2e;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      letter-spacing: 0.03em;
    }
    .join-btn:disabled { background: #445; color: #889; cursor: not-allowed; }
    .join-btn:active:not(:disabled) { transform: scale(0.98); }

    .join-error {
      font-size: 16px;
      color: #ff6b6b;
      text-align: center;
      min-height: 24px;
    }

    /* ── Waiting Screen ── */
    .waiting-screen {
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      gap: 16px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
    }

    .waiting-title {
      font-size: 24px;
      font-weight: 700;
      text-align: center;
    }

    .waiting-name {
      font-size: 20px;
      color: #4ecca3;
      font-weight: 600;
    }

    .waiting-dots {
      font-size: 28px;
      animation: dotPulse 1.5s ease-in-out infinite;
    }

    @keyframes dotPulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .waiting-players {
      margin-top: 20px;
      width: 100%;
      max-width: 400px;
    }

    .waiting-players-title {
      font-size: 16px;
      color: #aab;
      margin-bottom: 8px;
    }

    .waiting-player-item {
      font-size: 18px;
      padding: 8px 16px;
      background: rgba(255,255,255,0.08);
      border-radius: 8px;
      margin-bottom: 6px;
    }

    /* ── Playing Screen ── */
    .playing-screen {
      background: #f5f5f5;
    }

    /* Bingo card */
    .card-section {
      padding: 12px;
      flex: 1;
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      color: #555;
      margin-bottom: 8px;
    }

    .bingo-card {
      display: flex;
      flex-direction: column;
      gap: 3px;
      max-width: 400px;
      margin: 0 auto;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }

    .bingo-row {
      display: flex;
      gap: 3px;
    }

    .bingo-cell {
      flex: 1;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      border-radius: 8px;
      background: #fff;
      color: #333;
      border: 2px solid #ddd;
      min-width: 48px;
      min-height: 48px;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      cursor: pointer;
    }

    .bingo-header-cell {
      background: #1a1a2e;
      color: #fff;
      font-size: 18px;
      font-weight: 800;
      border: none;
      aspect-ratio: auto;
      min-height: 36px;
    }

    .bingo-header-cell.col-B { background: #1155cc; }
    .bingo-header-cell.col-I { background: #c0392b; }
    .bingo-header-cell.col-N { background: #1a6e1a; }
    .bingo-header-cell.col-G { background: #7d3c98; }
    .bingo-header-cell.col-O { background: #b7600a; }

    .bingo-cell.marked {
      background: #4ecca3;
      color: #fff;
      border-color: #3daa88;
    }

    .bingo-cell:active {
      transform: scale(0.9);
    }

    /* Wrong tap — number hasn't been called */
    .bingo-cell.wrong-tap {
      animation: wrongShake 0.5s ease-out;
      background: #ff6b6b !important;
      color: #fff !important;
      border-color: #e74c3c !important;
    }

    @keyframes wrongShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    @keyframes markPop {
      0%   { transform: scale(0.8); background: #ffd700; }
      100% { transform: scale(1); }
    }

    .bingo-cell.free {
      background: #ffd700;
      color: #1a1a2e;
      border-color: #e6c200;
      font-size: 12px;
      font-weight: 800;
    }

    /* Called history strip */
    .history-strip {
      display: flex;
      gap: 6px;
      padding: 10px 12px;
      overflow-x: auto;
      background: #eee;
    }

    .history-ball {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
    }

    .history-ball.col-B { background: #1155cc; }
    .history-ball.col-I { background: #c0392b; }
    .history-ball.col-N { background: #1a6e1a; }
    .history-ball.col-G { background: #7d3c98; }
    .history-ball.col-O { background: #b7600a; }

    .history-ball.newest {
      outline: 2px solid #ffd700;
      outline-offset: 2px;
    }

    /* ── Game Over Screen ── */
    .gameover-screen {
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      gap: 16px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
    }

    .gameover-emoji { font-size: 80px; }

    .gameover-title {
      font-size: 48px;
      font-weight: 900;
      color: #ffd700;
    }

    .gameover-msg {
      font-size: 22px;
      font-weight: 600;
      text-align: center;
      max-width: 350px;
    }

    .gameover-personal {
      font-size: 28px;
      font-weight: 800;
      color: #4ecca3;
      text-align: center;
    }

    /* ── Reconnect ── */
    .reconnect-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #fff;
      z-index: 100;
    }

    /* ── Confetti ── */
    .confetti-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 99;
      overflow: hidden;
    }
    .confetti-piece {
      position: absolute;
      width: 10px;
      height: 10px;
      top: -10px;
      opacity: 0;
      animation: confettiFall 3s ease-in forwards;
    }
    @keyframes confettiFall {
      0% { opacity: 1; top: -10px; transform: rotate(0deg) scale(1); }
      100% { opacity: 0; top: 110vh; transform: rotate(720deg) scale(0.5); }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- ── Join Screen ── -->
  <div id="joinScreen" class="screen join-screen active">
    <div class="join-title">CaritaHub Bingo</div>
    <div class="join-subtitle">Enter your name to join</div>
    <input id="nameInput" class="join-input" type="text" placeholder="Your Name" maxlength="30" autocomplete="off" />
    <button id="joinBtn" class="join-btn">Join Game</button>
    <div id="joinError" class="join-error"></div>
  </div>

  <!-- ── Waiting Screen ── -->
  <div id="waitingScreen" class="screen waiting-screen">
    <div class="waiting-title">Waiting for game to start</div>
    <div class="waiting-dots">...</div>
    <div id="waitingName" class="waiting-name"></div>
    <div class="waiting-players">
      <div class="waiting-players-title">Players in game:</div>
      <div id="waitingPlayerList"></div>
    </div>
  </div>

  <!-- ── Playing Screen ── -->
  <div id="playingScreen" class="screen playing-screen">
    <div class="card-section">
      <div id="cardTitle" class="card-title">Your Bingo Card</div>
      <div id="bingoCard" class="bingo-card"></div>
    </div>
    <div id="historyStrip" class="history-strip"></div>
  </div>

  <!-- ── Game Over Screen ── -->
  <div id="gameoverScreen" class="screen gameover-screen">
    <div class="gameover-emoji">🎉</div>
    <div id="gameoverTitle" class="gameover-title">BINGO!</div>
    <div id="gameoverPersonal" class="gameover-personal"></div>
    <div id="gameoverMsg" class="gameover-msg"></div>
  </div>

  <!-- ── Confetti Container ── -->
  <div id="confettiContainer" class="confetti-container hidden"></div>

  <!-- ── Reconnect Overlay ── -->
  <div id="reconnectOverlay" class="reconnect-overlay hidden">
    Connection lost. Reconnecting...
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/tv-bingo-play.js"></script>
</body>
</html>
