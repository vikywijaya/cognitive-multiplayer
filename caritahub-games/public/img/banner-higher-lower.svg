<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220">
  <!-- Background -->
  <rect width="480" height="220" fill="#1a2340"/>

  <!-- Felt table background -->
  <ellipse cx="175" cy="180" rx="170" ry="50" fill="#0d3b1e" opacity="0.5"/>

  <!-- Card stack (back) -->
  <rect x="60" y="40" width="90" height="130" rx="8" fill="#1a3a6e" stroke="#2a4a8e" stroke-width="1.5"/>
  <rect x="64" y="44" width="82" height="122" rx="6" fill="#1e3f75"/>
  <!-- Card back pattern -->
  <g opacity="0.3">
    <line x1="70" y1="50" x2="140" y2="160" stroke="#4a70cc" stroke-width="1"/>
    <line x1="85" y1="50" x2="140" y2="145" stroke="#4a70cc" stroke-width="1"/>
    <line x1="100" y1="50" x2="140" y2="130" stroke="#4a70cc" stroke-width="1"/>
    <line x1="70" y1="65" x2="125" y2="160" stroke="#4a70cc" stroke-width="1"/>
    <line x1="70" y1="80" x2="110" y2="160" stroke="#4a70cc" stroke-width="1"/>
  </g>

  <!-- Main face-up card (Ace of Spades) -->
  <rect x="100" y="30" width="90" height="130" rx="8" fill="white" stroke="#ddd" stroke-width="1.5"/>
  <text x="113" y="52" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#111">A</text>
  <text x="113" y="68" font-family="Georgia, serif" font-size="14" fill="#111">♠</text>
  <text x="177" y="148" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#111" transform="rotate(180 177 148)">A</text>
  <text x="177" y="132" font-family="Georgia, serif" font-size="14" fill="#111" transform="rotate(180 177 132)">♠</text>
  <!-- Big centre spade -->
  <text x="145" y="110" text-anchor="middle" font-family="Georgia, serif" font-size="44" fill="#111">♠</text>

  <!-- Next card (partially revealed, hearts) -->
  <rect x="205" y="35" width="90" height="130" rx="8" fill="white" stroke="#ddd" stroke-width="1.5"/>
  <text x="218" y="57" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#cc2222">7</text>
  <text x="218" y="73" font-family="Georgia, serif" font-size="14" fill="#cc2222">♥</text>
  <!-- Big centre heart -->
  <text x="250" y="115" text-anchor="middle" font-family="Georgia, serif" font-size="44" fill="#cc2222">♥</text>

  <!-- HIGHER button -->
  <rect x="135" y="175" width="70" height="28" rx="14" fill="#27ae60"/>
  <text x="170" y="193" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="white">▲ HIGHER</text>

  <!-- LOWER button -->
  <rect x="215" y="175" width="70" height="28" rx="14" fill="#c0392b"/>
  <text x="250" y="193" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="white">▼ LOWER</text>

  <!-- Right decorative panel -->
  <rect x="310" y="20" width="154" height="180" rx="8" fill="#ffffff" opacity="0.05"/>

  <!-- Question mark decoration -->
  <text x="387" y="130" text-anchor="middle" font-family="Georgia, serif" font-size="90" fill="white" opacity="0.10">?</text>

  <!-- Score streak -->
  <rect x="320" y="45" width="130" height="40" rx="8" fill="#27ae60" opacity="0.9"/>
  <text x="385" y="62" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="white">STREAK</text>
  <text x="385" y="78" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="white">🔥 7</text>

  <!-- Title badge -->
  <rect x="310" y="145" width="154" height="42" rx="8" fill="#2255cc"/>
  <text x="387" y="163" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="white">HIGHER OR</text>
  <text x="387" y="178" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="white">LOWER</text>
</svg>
