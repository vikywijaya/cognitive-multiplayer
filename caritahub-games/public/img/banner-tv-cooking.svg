<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220">
  <!-- Background -->
  <rect width="480" height="220" fill="#1a0a00"/>

  <!-- Kitchen counter -->
  <rect x="0" y="170" width="290" height="50" fill="#3d2b1f"/>
  <rect x="0" y="165" width="290" height="8" fill="#5a3f2f"/>

  <!-- Stove top -->
  <rect x="35" y="125" width="230" height="55" rx="8" fill="#2a2a2a"/>
  <!-- Burners -->
  <circle cx="95"  cy="155" r="28" fill="#1a1a1a" stroke="#555" stroke-width="2"/>
  <circle cx="95"  cy="155" r="20" fill="#111" stroke="#444" stroke-width="1"/>
  <circle cx="95"  cy="155" r="10" fill="#333"/>
  <circle cx="195" cy="155" r="28" fill="#1a1a1a" stroke="#555" stroke-width="2"/>
  <circle cx="195" cy="155" r="20" fill="#111" stroke="#444" stroke-width="1"/>
  <!-- Active burner - fire glow -->
  <circle cx="195" cy="155" r="12" fill="#ff6600" opacity="0.8"/>
  <circle cx="195" cy="155" r="7"  fill="#ffcc00" opacity="0.9"/>

  <!-- Pan on left burner -->
  <ellipse cx="95" cy="130" rx="35" ry="12" fill="#555"/>
  <rect x="60" y="120" width="70" height="14" rx="4" fill="#444"/>
  <ellipse cx="95" cy="122" rx="32" ry="8" fill="#333"/>
  <!-- Food in pan -->
  <ellipse cx="88" cy="122" rx="8" ry="6" fill="#8B4513" opacity="0.9"/>
  <ellipse cx="102" cy="121" rx="6" ry="5" fill="#cc7722" opacity="0.9"/>
  <ellipse cx="95" cy="118" rx="5" ry="4" fill="#ffcc44" opacity="0.9"/>
  <!-- Handle -->
  <rect x="130" y="122" width="35" height="8" rx="4" fill="#222"/>

  <!-- Pot on right burner -->
  <ellipse cx="195" cy="118" rx="38" ry="14" fill="#777" stroke="#555" stroke-width="1.5"/>
  <rect x="158" y="110" width="74" height="22" rx="4" fill="#666"/>
  <ellipse cx="195" cy="112" rx="34" ry="9" fill="#888"/>
  <!-- Steam -->
  <path d="M 180 105 Q 178 95 183 88" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
  <path d="M 195 103 Q 193 93 198 86" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
  <path d="M 210 105 Q 208 95 213 88" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- Flames under pot -->
  <path d="M 185 140 Q 182 133 188 128 Q 190 135 195 130 Q 197 138 203 133 Q 206 140 202 147 Q 195 145 185 140Z" fill="#ff6600" opacity="0.8"/>
  <path d="M 188 138 Q 186 133 190 130 Q 192 135 195 131 Q 198 135 200 138 Q 195 140 188 138Z" fill="#ffcc00" opacity="0.9"/>

  <!-- TV frame on wall -->
  <rect x="30" y="15" width="200" height="100" rx="8" fill="#1a2a40" stroke="#3a5a80" stroke-width="3"/>
  <rect x="37" y="22" width="186" height="86" rx="5" fill="#0a1020"/>

  <!-- Task card on TV -->
  <rect x="50" y="33" width="160" height="62" rx="8" fill="#c0392b"/>
  <text x="130" y="54" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30">🍳</text>
  <text x="130" y="83" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="white">FLIP IT!</text>

  <!-- Right decorative panel -->
  <rect x="296" y="20" width="154" height="180" rx="8" fill="#ff6600" opacity="0.08"/>

  <!-- Kitchen Rush title area -->
  <text x="373" y="65" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#ffcc00" opacity="0.9">🍳</text>

  <!-- Task badges -->
  <rect x="308" y="80" width="130" height="24" rx="12" fill="#c0392b" opacity="0.9"/>
  <text x="373" y="96" text-anchor="middle" font-family="Helvetica" font-size="11" font-weight="bold" fill="white">🔪 CHOP!</text>

  <rect x="308" y="112" width="130" height="24" rx="12" fill="#e67e22" opacity="0.9"/>
  <text x="373" y="128" text-anchor="middle" font-family="Helvetica" font-size="11" font-weight="bold" fill="white">🥄 STIR!</text>

  <rect x="308" y="144" width="130" height="24" rx="12" fill="#27ae60" opacity="0.9"/>
  <text x="373" y="160" text-anchor="middle" font-family="Helvetica" font-size="11" font-weight="bold" fill="white">🍳 FLIP!</text>

  <!-- Title badge -->
  <rect x="308" y="182" width="130" height="22" rx="11" fill="#c0392b"/>
  <text x="373" y="197" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="white">KITCHEN RUSH!</text>
</svg>
