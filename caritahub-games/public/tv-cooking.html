<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CaritaHub Kitchen Rush!</title>
  <link rel="stylesheet" href="/css/tv-cooking.css" />
</head>
<body>

  <!-- Lobby Phase -->
  <div id="lobbyPhase" class="phase active">
    <div class="lobby-title">🍳 Kitchen Rush!</div>
    <div class="lobby-subtitle">Multiplayer Cooking — Scan with your phone to join as a chef!</div>
    <div class="lobby-body">
      <div class="qr-section">
        <div class="qr-box"><div id="qrcode"></div></div>
        <div class="qr-instruction">Scan with phone camera</div>
        <div id="joinUrl" class="qr-url"></div>
      </div>
      <div class="player-section">
        <div class="player-section-title">Chefs Joined</div>
        <div id="lobbyPlayerList" class="player-list">
          <div class="player-empty">Waiting for chefs…</div>
        </div>
        <button id="startBtn" class="start-btn" disabled>Start Cooking!</button>
      </div>
    </div>
  </div>

  <!-- Playing Phase -->
  <div id="playingPhase" class="phase">
    <!-- Top HUD -->
    <div class="top-hud">
      <span class="hud-title">🍳 Kitchen Rush!</span>
      <span class="hud-timer" id="timerDisplay">3:00</span>
      <span class="hud-score" id="scoreDisplay">0 pts</span>
    </div>
    <!-- Main area -->
    <div class="main-area">
      <!-- Kitchen scene (animated) -->
      <div class="kitchen-scene" id="kitchenScene">
        <div class="kitchen-floor"></div>
        <!-- Serving window (top) -->
        <div class="serving-window" id="servingWindow"></div>
        <!-- Stations (positioned by JS) -->
        <div class="station station-chop" id="stationChop" style="left:8%;top:30%;">
          <div class="station-body">🔪</div>
          <div class="station-label">Chop</div>
        </div>
        <div class="station station-stove" id="stationStove" style="left:40%;top:30%;">
          <div class="station-body">🍳</div>
          <div class="station-label">Stove</div>
        </div>
        <div class="station station-plate" id="stationPlate" style="left:72%;top:30%;">
          <div class="station-body">🍽️</div>
          <div class="station-label">Plate</div>
        </div>
        <!-- Avatars injected by JS -->
        <div id="avatarsContainer"></div>
      </div>
      <!-- Orders panel (right) -->
      <div class="orders-panel">
        <div class="orders-panel-title">📋 Active Orders</div>
        <div class="orders-list" id="ordersList"></div>
      </div>
    </div>
    <!-- Chefs bar (bottom) -->
    <div class="chefs-bar" id="chefsBar"></div>
  </div>

  <!-- Game Over Phase -->
  <div id="gameoverPhase" class="phase">
    <div class="gameover-emoji">🏆</div>
    <div class="gameover-title">Time's Up!</div>
    <div class="gameover-score">Final Score: <span id="finalScore">0</span></div>
    <div class="gameover-stats" id="gameoverStats"></div>
    <button id="playAgainBtn" class="gameover-btn">Play Again</button>
  </div>

  <!-- Reconnect overlay -->
  <div id="reconnectOverlay" class="reconnect-overlay hidden">Connection lost. Reconnecting…</div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="/js/tv-cooking.js"></script>
</body>
</html>
