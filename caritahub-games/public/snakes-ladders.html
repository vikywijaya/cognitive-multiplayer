<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CaritaHub Snakes &amp; Ladders</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #1a1a2e;
      color: #fff;
      -webkit-text-size-adjust: 100%;
    }

    #gameApp {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      max-width: 520px;
      margin: 0 auto;
    }

    /* ── Status bar ── */
    #statusBar {
      background: #16213e;
      color: #f0c040;
      text-align: center;
      padding: 10px 16px;
      font-size: 1rem;
      font-weight: 700;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Board ── */
    #boardWrap {
      position: relative;
      width: 100%;
      background: #e8dfc8;
      flex-shrink: 0;
    }

    #boardCanvas {
      width: 100%;
      height: auto;
      display: block;
      touch-action: none;
    }

    /* Event toast overlaid on board */
    #eventToast {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.82);
      color: #fff;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.5s;
    }
    #eventToast.hidden  { display: none; }
    #eventToast.fade-out { opacity: 0; }

    /* ── Controls ── */
    #controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 18px 16px;
      background: #0f1b30;
      border-top: 2px solid rgba(240,192,64,0.15);
      transition: background 0.3s;
    }
    #controls.dice-flash {
      animation: ctrlFlash 0.5s ease-out;
    }
    @keyframes ctrlFlash {
      0%   { background: rgba(240,192,64,0.45); }
      100% { background: #0f1b30; }
    }

    /* Die box */
    #diceDisplay {
      width: 110px;
      height: 110px;
      background: #fff;
      border-radius: 18px;
      box-shadow:
        0 8px 24px rgba(0,0,0,0.45),
        inset 0 -5px 0 rgba(0,0,0,0.18),
        inset 0 2px 4px rgba(255,255,255,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      flex-shrink: 0;
      padding: 14px;
      transform-origin: center center;
    }
    #diceDisplay svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    #diceDisplay.rolling {
      animation: diceRoll 0.1s linear infinite;
    }
    #diceDisplay.landing {
      animation: diceLand 0.55s cubic-bezier(0.22, 1.5, 0.36, 1) forwards;
    }
    @keyframes diceRoll {
      0%   { transform: rotate(-15deg) scale(1.06) translateY(-3px); }
      25%  { transform: rotate(13deg)  scale(1.10) translateY(-6px); }
      50%  { transform: rotate(-10deg) scale(1.06) translateY(-2px); }
      75%  { transform: rotate(15deg)  scale(1.10) translateY(-6px); }
      100% { transform: rotate(-15deg) scale(1.06) translateY(-3px); }
    }
    @keyframes diceLand {
      0%   { transform: scale(0.7) rotate(25deg); box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
      55%  { transform: scale(1.45) rotate(-4deg); box-shadow: 0 16px 40px rgba(240,192,64,0.55); }
      75%  { transform: scale(0.92) rotate(2deg);  box-shadow: 0 8px 24px rgba(0,0,0,0.45); }
      100% { transform: scale(1)    rotate(0deg);  box-shadow: 0 8px 24px rgba(0,0,0,0.45), inset 0 -5px 0 rgba(0,0,0,0.18), inset 0 2px 4px rgba(255,255,255,0.9); }
    }

    #rollBtn {
      font-size: 1.25rem;
      font-weight: 800;
      padding: 18px 38px;
      background: linear-gradient(135deg, #f5d020, #f0c040, #e6a800);
      color: #1a1a2e;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      letter-spacing: 0.03em;
      box-shadow: 0 5px 18px rgba(240,192,64,0.5), inset 0 1px 0 rgba(255,255,255,0.4);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    #rollBtn:disabled {
      background: #2a3550;
      color: #556;
      cursor: not-allowed;
      box-shadow: none;
    }
    #rollBtn:active:not(:disabled) { transform: scale(0.94); }
    #rollBtn.pulse {
      animation: btnPulse 1.1s ease-in-out infinite;
    }
    @keyframes btnPulse {
      0%, 100% { box-shadow: 0 5px 18px rgba(240,192,64,0.5), inset 0 1px 0 rgba(255,255,255,0.4); }
      50%       { box-shadow: 0 5px 36px rgba(240,192,64,1), 0 0 0 8px rgba(240,192,64,0.2), inset 0 1px 0 rgba(255,255,255,0.4); }
    }

    #statusBar.my-turn {
      color: #ffe066;
      background: #1a2e1a;
    }

    /* ── Players panel ── */
    #playersPanel {
      flex: 1;
      padding: 10px 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
    }

    .player-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 13px;
      border-radius: 10px;
      background: rgba(255,255,255,0.05);
      transition: background 0.2s;
    }
    .player-row.active {
      background: rgba(240,192,64,0.14);
      outline: 2px solid #f0c040;
    }

    .player-token {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      color: #fff;
      flex-shrink: 0;
      border: 2px solid rgba(255,255,255,0.4);
    }

    .player-name {
      flex: 1;
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-name.me { color: #f0c040; }

    .player-pos {
      font-size: 13px;
      color: #aab;
      font-weight: 500;
      min-width: 55px;
      text-align: right;
    }
    .player-pos.winner { color: #ffd700; font-weight: 800; }

    /* ── Game-over overlay ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .overlay.hidden { display: none; }

    .overlay-box {
      background: #16213e;
      border-radius: 18px;
      padding: 36px 28px;
      max-width: 340px;
      width: 90%;
      text-align: center;
      color: #fff;
    }
    .overlay-box h2 { margin: 0 0 10px; font-size: 2.2rem; }
    .overlay-box p  { margin: 0 0 24px; font-size: 1.1rem; color: #ccc; }
    .overlay-btns   { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

    .btn {
      display: inline-block;
      font-size: 1rem;
      font-weight: 700;
      padding: 13px 26px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      text-decoration: none;
    }
    .btn-primary   { background: #f0c040; color: #1a1a2e; }
    .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; }

    /* ── Confetti ── */
    #confettiContainer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 99;
      overflow: hidden;
    }
    .confetti-piece {
      position: absolute;
      width: 10px;
      height: 10px;
      top: -10px;
      opacity: 0;
      animation: confettiFall 3s ease-in forwards;
    }
    @keyframes confettiFall {
      0%   { opacity: 1; top: -10px; transform: rotate(0deg) scale(1); }
      100% { opacity: 0; top: 110vh; transform: rotate(720deg) scale(0.5); }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div id="gameApp">
  <div id="statusBar">Loading game…</div>

  <div id="boardWrap">
    <canvas id="boardCanvas"></canvas>
    <div id="eventToast" class="hidden"></div>
  </div>

  <div id="controls">
    <div id="diceDisplay"></div>
    <button id="rollBtn" disabled>Roll Dice</button>
  </div>

  <div id="playersPanel"></div>
</div>

<!-- Game-over overlay -->
<div id="gameOverlay" class="overlay hidden">
  <div class="overlay-box">
    <h2 id="gameOverTitle">Game Over</h2>
    <p id="gameOverMsg"></p>
    <div class="overlay-btns">
      <button id="playAgainBtn" class="btn btn-primary">New Game</button>
      <a href="/" class="btn btn-secondary">Home</a>
    </div>
  </div>
</div>

<div id="confettiContainer" class="hidden"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/snakes-ladders.js"></script>
</body>
</html>
