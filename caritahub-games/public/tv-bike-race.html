<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TV Bike Race!</title>
  <link rel="stylesheet" href="/css/tv-bike-race.css" />
</head>
<body>

  <!-- ── Lobby Phase ─────────────────────────────────── -->
  <div id="lobbyPhase" class="phase active">
    <div class="lobby-title">🚲 Bike Race!</div>
    <div class="lobby-subtitle">Scan with your phone to join — pedal fast to win!</div>
    <div class="lobby-body">
      <div class="qr-section">
        <div class="room-code-box">
          <div class="room-code-label">Room Code</div>
          <div class="room-code-value" id="roomCodeValue">—</div>
        </div>
        <div class="qr-box"><div id="qrcode"></div></div>
        <div class="qr-instruction">Scan QR or go to:</div>
        <div id="joinUrl" class="qr-url"></div>
      </div>
      <div class="player-section">
        <div class="player-section-title">🏁 Racers Ready</div>
        <div id="lobbyPlayerList" class="player-list">
          <div class="player-empty">Waiting for racers…</div>
        </div>
        <button id="startBtn" class="start-btn" disabled>Start Race!</button>
      </div>
    </div>
  </div>

  <!-- ── Countdown Phase ────────────────────────────── -->
  <div id="countdownPhase" class="phase">
    <div class="countdown-container">
      <div class="countdown-label" id="countdownLabel">Race starts in…</div>
      <div class="countdown-number" id="countdownNum">3</div>
      <div class="countdown-racers" id="countdownRacers"></div>
    </div>
  </div>

  <!-- ── Racing Phase ───────────────────────────────── -->
  <div id="racingPhase" class="phase">
    <div class="race-hud">
      <span class="hud-title">🚲 Bike Race!</span>
      <span class="hud-round" id="hudRound">Round 1/3</span>
      <span class="hud-laps" id="hudElapsed">0:00</span>
    </div>
    <!-- Commentator strip -->
    <div class="commentator-strip" id="commentatorStrip">
      <div class="commentator-icon">🎙️</div>
      <div class="speech-bubble">
        <div class="speech-text" id="speechText"></div>
      </div>
    </div>
    <div class="spectator-row" id="spectatorsTop"></div>
    <div class="race-track-container" id="raceTrackContainer"></div>
    <div class="spectator-row" id="spectatorsBottom"></div>
  </div>

  <!-- Reconnect overlay -->
  <div id="reconnectOverlay" class="reconnect-overlay hidden">Connection lost. Reconnecting…</div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="/js/bike-race-sfx.js"></script>
  <script>
  'use strict';

  const socket = io({ transports: ['websocket', 'polling'] });

  // ── DOM refs ──────────────────────────────────────────────────────────────
  const lobbyPhase         = document.getElementById('lobbyPhase');
  const countdownPhase     = document.getElementById('countdownPhase');
  const racingPhase        = document.getElementById('racingPhase');
  const lobbyPlayerList    = document.getElementById('lobbyPlayerList');
  const startBtn           = document.getElementById('startBtn');
  const joinUrlEl          = document.getElementById('joinUrl');
  const countdownLabel     = document.getElementById('countdownLabel');
  const countdownNum       = document.getElementById('countdownNum');
  const countdownRacers    = document.getElementById('countdownRacers');
  const raceTrackContainer = document.getElementById('raceTrackContainer');
  const hudRound           = document.getElementById('hudRound');
  const hudElapsed         = document.getElementById('hudElapsed');
  const spectatorsTop      = document.getElementById('spectatorsTop');
  const spectatorsBottom   = document.getElementById('spectatorsBottom');
  const commentatorStrip   = document.getElementById('commentatorStrip');
  const speechText         = document.getElementById('speechText');
  const reconnectOverlay   = document.getElementById('reconnectOverlay');

  // ── State ─────────────────────────────────────────────────────────────────
  let myRoomId       = null;
  let myColor        = null;
  let raceOver       = false;
  let elapsedTimer   = null;
  let startedAt      = null;
  let currentRound   = 1;

  // Commentary state
  let lastLeaderName   = null;
  const commentFinished = new Set();
  let lastCommentAt    = 0;
  let commentHideTimer = null;
  let commentCooldown  = false;

  const SPECTATORS = ['🧑', '👦', '👧', '🧒', '👴', '👵', '🧑‍🦱', '🧑‍🦳',
                       '🙋', '🙆', '🤸', '👏', '🎉', '🎊', '🏳️', '🚩',
                       '🧑‍🤝‍🧑', '👫', '👬', '👭'];

  // ── Helpers ───────────────────────────────────────────────────────────────
  function showPhase(id) {
    [lobbyPhase, countdownPhase, racingPhase].forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }
  function esc(s) {
    return s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') : '';
  }
  function formatElapsed(ms) {
    if (!ms && ms !== 0) return '—';
    const s = Math.floor(ms / 1000);
    return `${Math.floor(s / 60)}:${(s % 60).toString().padStart(2, '0')}`;
  }
  function rankLabel(n) {
    return ['', '1st', '2nd', '3rd', '4th', '5th', '6th'][n] || `${n}th`;
  }
  function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  // ── Race Commentator ──────────────────────────────────────────────────────
  const LINES = {
    start: [
      "🚲 They're off! 3 rounds — let's RACE!!",
      "💨 Round begins! Pedal HARDER!",
      "🏁 First one across wins the round! GO!",
    ],
    roundStart: [
      (r, t) => `🔄 Round ${r} of ${t} — PEDAL!!`,
      (r, t) => `🚲 Round ${r}! ${t - r} more after this!`,
      (r, t) => `🔥 FINAL ROUND — Round ${r} of ${t}! Everything on the line!`,
    ],
    lead: [
      (n, e) => `${e} ${n} surges to the front!`,
      (n, e) => `💨 ${n} takes the lead! Can they hold it?`,
      (n, e) => `🔥 Look at ${n} go! Unbelievable speed!`,
      (n, e) => `${e} ${n} is flying down the track!`,
    ],
    close: [
      "😱 It's NECK AND NECK! Anyone could win this round!",
      "🔥 Too close to call! What a race!!",
      "💥 Unbelievable! They're right on top of each other!",
    ],
    halfway: [
      (n, e) => `⚡ ${n} hits the halfway mark first!`,
      (n, e) => `🚲 ${n} is picking up serious pace!`,
      (n, e) => `💪 ${n} is pedaling like a champion!`,
    ],
    final: [
      (n, e) => `🔥 ${n} is sprinting for the finish line!`,
      (n, e) => `😤 ${n} giving it EVERYTHING in the final stretch!`,
      (n, e) => `🚀 ${n} is FLYING! Will anyone catch them?!`,
    ],
    win: [
      (n, e) => `🏆 ${e} ${n} WINS THE ROUND!! INCREDIBLE!!`,
      (n, e) => `🎉 ${n} crosses first! Round victory!`,
    ],
    p2:  [(n, e) => `🥈 ${n} finishes in second place!`],
    p3:  [(n, e) => `🥉 ${n} takes third!`],
    pN:  [(n, e) => `🏁 ${n} crosses the line!`],
  };

  function say(text, hold = 3200) {
    speechText.textContent = text;
    commentatorStrip.classList.add('speaking');
    clearTimeout(commentHideTimer);
    commentHideTimer = setTimeout(() => commentatorStrip.classList.remove('speaking'), hold);
    lastCommentAt = Date.now();
    commentCooldown = true;
    setTimeout(() => { commentCooldown = false; }, 2200);
  }

  function updateCommentary(gs) {
    if (commentCooldown) return;
    if (Date.now() - lastCommentAt < 2200) return;

    const sorted = [...gs.players].sort((a, b) => b.position - a.position);
    const leader = sorted[0];
    if (!leader) return;

    // Priority 1: new finishers this round
    for (const p of gs.players) {
      if (p.finished && !commentFinished.has(p.id)) {
        commentFinished.add(p.id);
        if (p.rank === 1) {
          say(pickRandom(LINES.win)(p.name, p.emoji), 4000);
          BikeRaceSFX.finish();
        } else if (p.rank === 2) {
          say(pickRandom(LINES.p2)(p.name, p.emoji));
          BikeRaceSFX.finishSmall();
        } else if (p.rank === 3) {
          say(pickRandom(LINES.p3)(p.name, p.emoji));
          BikeRaceSFX.finishSmall();
        } else {
          say(pickRandom(LINES.pN)(p.name, p.emoji));
        }
        return;
      }
    }

    // Priority 2: leader change
    if (!leader.finished && leader.name !== lastLeaderName) {
      lastLeaderName = leader.name;
      say(pickRandom(LINES.lead)(leader.name, leader.emoji));
      BikeRaceSFX.leaderChange();
      return;
    }

    // Priority 3: close race
    if (sorted.length > 1 && !leader.finished) {
      const gap = sorted[0].progress - sorted[1].progress;
      if (gap < 0.07 && leader.progress > 0.25) {
        say(pickRandom(LINES.close));
        BikeRaceSFX.crowd();
        return;
      }
    }

    // Priority 4: progress milestones
    if (!leader.finished) {
      const prog = leader.progress;
      if (prog > 0.82) {
        say(pickRandom(LINES.final)(leader.name, leader.emoji));
        BikeRaceSFX.finalStretch();
      } else if (prog > 0.45 && prog < 0.58) {
        say(pickRandom(LINES.halfway)(leader.name, leader.emoji));
      }
    }
  }

  // ── Spectators ────────────────────────────────────────────────────────────
  function buildSpectators() {
    function makeRow(count) {
      let html = '';
      for (let i = 0; i < count; i++) {
        html += `<span>${SPECTATORS[Math.floor(Math.random() * SPECTATORS.length)]}</span>`;
      }
      return html;
    }
    spectatorsTop.innerHTML    = makeRow(40);
    spectatorsBottom.innerHTML = makeRow(40);
  }

  // ── QR Code ───────────────────────────────────────────────────────────────
  function buildQR(roomId) {
    const url = `${location.protocol}//${location.host}/tv-bike-race-play?room=${roomId}`;
    document.getElementById('roomCodeValue').textContent = roomId;
    joinUrlEl.textContent = url;
    new QRCode(document.getElementById('qrcode'), {
      text: url, width: 200, height: 200,
      colorDark: '#000', colorLight: '#fff'
    });
  }

  // ── Lobby player list ─────────────────────────────────────────────────────
  function updateLobbyPlayers(players) {
    const racers = players.filter(p => p.color !== 'tv-host');
    if (!racers.length) {
      lobbyPlayerList.innerHTML = '<div class="player-empty">Waiting for racers…</div>';
      startBtn.disabled = true;
      return;
    }
    const EMOJIS = ['🐢', '🐇', '🦊', '🐻', '🦔', '🐼'];
    const COLORS = ['#e74c3c', '#3498db', '#2ecc71', '#f39c12', '#9b59b6', '#1abc9c'];
    lobbyPlayerList.innerHTML = racers.map((p, i) => `
      <div class="player-row" style="--pcolor:${COLORS[i] || '#fff'}">
        <span class="player-row-emoji">${EMOJIS[i] || '🚲'}</span>
        <span class="player-row-name">${esc(p.name)}</span>
        <span class="player-row-ready">Ready!</span>
      </div>
    `).join('');
    startBtn.disabled = false;
  }

  // ── Countdown ─────────────────────────────────────────────────────────────
  function runCountdown(players, label, cb) {
    showPhase('countdownPhase');
    countdownLabel.textContent = label;
    const EMOJIS = ['🐢', '🐇', '🦊', '🐻', '🦔', '🐼'];
    countdownRacers.innerHTML = players.map((p, i) => `
      <div class="countdown-racer" style="animation-delay:${i * 0.15}s">
        <span class="countdown-racer-emoji">${EMOJIS[i] || '🚲'}</span>
        <span class="countdown-racer-name" style="color:${p.color}">${esc(p.name)}</span>
      </div>
    `).join('');

    let count = 3;
    const COLORS_CD = ['#e74c3c', '#f39c12', '#2ecc71'];

    function tick() {
      countdownNum.className = 'countdown-number';
      if (count > 0) {
        countdownNum.textContent = count;
        countdownNum.style.color = COLORS_CD[count - 1];
        void countdownNum.offsetWidth;
        countdownNum.className = 'countdown-number';
        BikeRaceSFX.countTick(count);
        count--;
        setTimeout(tick, 900);
      } else {
        countdownNum.textContent = 'GO!';
        countdownNum.className = 'countdown-number go';
        BikeRaceSFX.go();
        setTimeout(cb, 700);
      }
    }
    tick();
  }

  // ── Build race track lanes ────────────────────────────────────────────────
  function buildRaceTrack(players) {
    buildSpectators();
    const oldLanes = raceTrackContainer.querySelectorAll('.player-lane');
    oldLanes.forEach(l => l.remove());

    for (const p of players) {
      const lane = document.createElement('div');
      lane.className = 'player-lane';
      lane.id = `lane-${p.id}`;
      lane.innerHTML = `
        <div class="lane-info">
          <div class="lane-rank" id="rank-${p.id}">—</div>
          <div class="lane-name" style="color:${p.color}">${esc(p.name)}</div>
          <div class="lane-wins" id="wins-${p.id}">0 wins</div>
          <div class="lane-speed" id="speed-${p.id}">0 km/h</div>
        </div>
        <div class="lane-body">
          <div class="lane-grass-top"></div>
          <div class="lane-road" id="road-${p.id}">
            <div class="lane-dashes" id="dashes-${p.id}"></div>
            <div class="road-finish-line"></div>
            <div class="lane-avatar" id="avatar-${p.id}">
              <div class="avatar-char">${p.emoji}</div>
              <div class="avatar-bike" id="bike-${p.id}">🚲</div>
            </div>
          </div>
          <div class="lane-grass-bottom"></div>
        </div>
        <div class="lane-finish">
          <div class="finish-flag" id="flag-${p.id}">🏁</div>
        </div>
      `;
      raceTrackContainer.appendChild(lane);
    }
  }

  // ── Reset track for next round ────────────────────────────────────────────
  function resetTrackForRound(players) {
    for (const p of players) {
      const avatarEl = document.getElementById(`avatar-${p.id}`);
      const flagEl   = document.getElementById(`flag-${p.id}`);
      const bikeEl   = document.getElementById(`bike-${p.id}`);
      const dashEl   = document.getElementById(`dashes-${p.id}`);
      const charEl   = avatarEl?.querySelector('.avatar-char');
      if (avatarEl) avatarEl.style.left = '2%';
      if (flagEl)   flagEl.classList.remove('crossed');
      if (bikeEl)   bikeEl.classList.remove('spinning');
      if (charEl)   charEl.classList.remove('riding');
      if (dashEl)   dashEl.classList.remove('moving');
    }
  }

  // ── Update race state ─────────────────────────────────────────────────────
  function updateRace(gs) {
    if (!gs.players) return;

    if (gs.elapsed !== undefined) hudElapsed.textContent = formatElapsed(gs.elapsed);
    if (gs.currentRound) hudRound.textContent = `Round ${gs.currentRound}/${gs.totalRounds}`;

    updateCommentary(gs);

    for (const p of gs.players) {
      const avatarEl = document.getElementById(`avatar-${p.id}`);
      const bikeEl   = document.getElementById(`bike-${p.id}`);
      const rankEl   = document.getElementById(`rank-${p.id}`);
      const winsEl   = document.getElementById(`wins-${p.id}`);
      const speedEl  = document.getElementById(`speed-${p.id}`);
      const dashEl   = document.getElementById(`dashes-${p.id}`);
      const flagEl   = document.getElementById(`flag-${p.id}`);
      if (!avatarEl) continue;

      // Win counter
      if (winsEl) {
        const w = p.roundWins || 0;
        winsEl.textContent = w === 1 ? '1 win' : `${w} wins`;
        winsEl.className = 'lane-wins' + (w > 0 ? ' has-wins' : '');
      }

      // Map progress 0→1 to 2%→90%
      const pct = 2 + (p.progress * 88);
      avatarEl.style.left = `${pct}%`;

      if (speedEl) speedEl.textContent = `${Math.round(p.speed * 12)} km/h`;

      if (rankEl) {
        rankEl.textContent = p.rank ? rankLabel(p.rank) : '—';
        rankEl.className = 'lane-rank' +
          (p.rank === 1 ? ' rank-1' : p.rank === 2 ? ' rank-2' : p.rank === 3 ? ' rank-3' : '');
      }

      const charEl = avatarEl.querySelector('.avatar-char');
      if (p.speed > 0.3) {
        bikeEl && bikeEl.classList.add('spinning');
        charEl && charEl.classList.add('riding');
        const dur = Math.max(0.12, 0.35 - p.speed * 0.02);
        if (bikeEl) bikeEl.style.animationDuration = `${dur}s`;
        if (charEl) charEl.style.animationDuration = `${dur}s`;
      } else {
        bikeEl && bikeEl.classList.remove('spinning');
        charEl && charEl.classList.remove('riding');
      }

      if (dashEl) {
        if (p.speed > 0.3) {
          dashEl.classList.add('moving');
          dashEl.style.animationDuration = `${Math.max(0.1, 0.5 - p.speed * 0.03)}s`;
        } else {
          dashEl.classList.remove('moving');
        }
      }

      if (flagEl && p.finished) flagEl.classList.add('crossed');
    }
  }

  // ── Round-over overlay ────────────────────────────────────────────────────
  function showRoundOver(round, totalRounds, players) {
    const existing = racingPhase.querySelector('.round-over-overlay');
    if (existing) existing.remove();

    const sorted  = [...players].sort((a, b) => (a.rank || 99) - (b.rank || 99));
    const medals  = ['🥇', '🥈', '🥉'];
    const isLast  = round >= totalRounds;

    const rows = sorted.map((p, i) => {
      const timeStr = p.finishTime ? formatElapsed(p.finishTime) : 'DNF';
      const wins    = p.roundWins || 0;
      return `<div class="round-result-row${i === 0 ? ' round-result-winner' : ''}">
        <span class="round-result-medal">${medals[i] || (i + 1) + 'th'}</span>
        <span class="round-result-name">${p.emoji} <span style="color:${p.color}">${esc(p.name)}</span></span>
        <span class="round-result-time">${timeStr}</span>
        <span class="round-result-wins">${wins > 0 ? '🏆'.repeat(wins) : ''}</span>
      </div>`;
    }).join('');

    const overlay = document.createElement('div');
    overlay.className = 'round-over-overlay';
    overlay.innerHTML = `
      <div class="round-over-content">
        <div class="round-over-title">🏁 Round ${round} Complete!</div>
        <div class="round-result-rows">${rows}</div>
        <div class="round-over-next">${isLast ? 'Final round done! Calculating results…' : `Round ${round + 1} starts in a moment!`}</div>
      </div>
    `;
    racingPhase.appendChild(overlay);
  }

  // ── Final winner banner ───────────────────────────────────────────────────
  function showWinner(rankings) {
    raceOver = true;
    if (elapsedTimer) { clearInterval(elapsedTimer); elapsedTimer = null; }

    // Remove any round-over overlay
    const ro = racingPhase.querySelector('.round-over-overlay');
    if (ro) ro.remove();

    const sorted = [...rankings].sort((a, b) => a.rank - b.rank);
    const first  = sorted[0];
    if (!first) return;

    const medals      = ['🥇', '🥈', '🥉'];
    const roundCount  = first.roundRanks.length;

    // Build round-by-round columns header
    const roundCols = Array.from({ length: roundCount }, (_, i) => `R${i + 1}`).join('</div><div class="summary-round-col">');

    const summaryRows = sorted.map((p, i) => {
      const roundCells = p.roundRanks.map((r, ri) => {
        const t    = p.roundTimes[ri];
        const timeStr = t ? formatElapsed(t) : 'DNF';
        return `<div class="summary-round-col ${r === 1 ? 'round-win' : ''}">${medals[r - 1] || r + 'th'}<br><small>${timeStr}</small></div>`;
      }).join('');
      const isWinner = i === 0;
      return `<div class="summary-row${isWinner ? ' summary-row-winner' : ''}">
        <div class="summary-medal">${medals[i] || (i + 1) + 'th'}</div>
        <div class="summary-avatar">${p.emoji} <span class="summary-name-text" style="color:${p.color}">${esc(p.name)}</span></div>
        ${roundCells}
        <div class="summary-wins">${'🏆'.repeat(p.roundWins)}</div>
      </div>`;
    }).join('');

    const banner = document.createElement('div');
    banner.className = 'winner-banner';
    banner.innerHTML = `
      <div class="winner-content">
        <div class="winner-top">
          <div class="winner-trophy">🏆</div>
          <div class="winner-label">CHAMPION!</div>
          <div class="winner-name" style="color:${first.color}">${esc(first.name)}</div>
          <div class="winner-emoji">${first.emoji} 🚲</div>
        </div>
        <div class="race-summary">
          <div class="race-summary-header">🏁 Final Results — 3 Rounds</div>
          <div class="race-summary-cols">
            <div class="summary-col-label"></div>
            <div class="summary-col-label"></div>
            ${Array.from({ length: roundCount }, (_, i) => `<div class="summary-col-label summary-round-col">Round ${i + 1}</div>`).join('')}
            <div class="summary-col-label">Wins</div>
          </div>
          <div class="race-summary-rows">${summaryRows}</div>
        </div>
        <button class="play-again-btn" id="playAgainBtn">Play Again</button>
      </div>
    `;
    racingPhase.appendChild(banner);
    document.getElementById('playAgainBtn').addEventListener('click', () => socket.emit('play_again'));
  }

  function startElapsedTimer() {
    startedAt    = Date.now();
    elapsedTimer = setInterval(() => {
      if (raceOver) { clearInterval(elapsedTimer); return; }
      hudElapsed.textContent = formatElapsed(Date.now() - startedAt);
    }, 500);
  }

  // ══════════════════════════════════════════════════════════════════════════
  //  SOCKET EVENTS
  // ══════════════════════════════════════════════════════════════════════════

  socket.on('connect', () => {
    reconnectOverlay.classList.add('hidden');
    if (!myRoomId) {
      socket.emit('join_game', { gameType: 'bike-race', playerName: 'TV Host' });
    } else {
      socket.emit('join_game', { gameType: 'bike-race', playerName: 'TV Host', roomId: myRoomId, reconnect: true });
    }
  });

  socket.on('disconnect', () => reconnectOverlay.classList.remove('hidden'));

  socket.on('joined', ({ roomId, color }) => {
    myRoomId = roomId; myColor = color;
    buildQR(roomId);
  });

  socket.on('room_update', ({ players }) => {
    if (!racingPhase.classList.contains('active')) updateLobbyPlayers(players);
  });

  startBtn.addEventListener('click', () => {
    BikeRaceSFX.unlock();
    socket.emit('start_game');
    startBtn.disabled = true;
  });

  socket.on('bike_race_started', (gs) => {
    // Remove any overlays from previous round
    const ro     = racingPhase.querySelector('.round-over-overlay');
    const banner = racingPhase.querySelector('.winner-banner');
    if (ro)     ro.remove();
    if (banner) banner.remove();

    // Reset commentary state
    lastLeaderName = null;
    commentFinished.clear();
    lastCommentAt  = 0;
    currentRound   = gs.currentRound || 1;

    const label  = currentRound === 1 ? 'Race starts in…' : `Round ${currentRound} starts in…`;
    const racers = gs.players;

    runCountdown(racers, label, () => {
      if (currentRound === 1) {
        buildRaceTrack(racers);
      } else {
        resetTrackForRound(racers);
      }
      showPhase('racingPhase');
      hudRound.textContent = `Round ${gs.currentRound}/${gs.totalRounds}`;
      raceOver = false;
      startElapsedTimer();
      updateRace(gs);
      const isLastRound = gs.currentRound === gs.totalRounds;
      const startLines  = isLastRound
        ? [(r, t) => `🔥 FINAL ROUND — Round ${r} of ${t}! Everything on the line!`]
        : LINES.start;
      if (isLastRound) {
        setTimeout(() => say(LINES.roundStart[2](gs.currentRound, gs.totalRounds), 3500), 800);
      } else if (currentRound === 1) {
        setTimeout(() => say(pickRandom(LINES.start), 3000), 800);
      } else {
        setTimeout(() => say(LINES.roundStart[0](gs.currentRound, gs.totalRounds), 2800), 800);
      }
    });
  });

  socket.on('bike_race_state', (gs) => {
    if (!racingPhase.classList.contains('active')) return;
    updateRace(gs);
  });

  socket.on('bike_race_round_over', ({ round, totalRounds, players }) => {
    raceOver = true;
    if (elapsedTimer) { clearInterval(elapsedTimer); elapsedTimer = null; }
    commentatorStrip.classList.remove('speaking');
    showRoundOver(round, totalRounds, players);
  });

  socket.on('bike_race_game_over', ({ winner, rankings }) => {
    showWinner(rankings);
  });

  socket.on('play_again', () => {
    raceOver = false;
    currentRound = 1;
    if (elapsedTimer) { clearInterval(elapsedTimer); elapsedTimer = null; }
    const banner  = racingPhase.querySelector('.winner-banner');
    const overlay = racingPhase.querySelector('.round-over-overlay');
    if (banner)  banner.remove();
    if (overlay) overlay.remove();
    commentatorStrip.classList.remove('speaking');
    showPhase('lobbyPhase');
  });

  socket.on('error', ({ message }) => {
    console.warn('Error:', message);
    startBtn.disabled = false;
  });
  </script>
</body>
</html>
