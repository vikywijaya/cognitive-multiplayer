<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220">
  <!-- Background -->
  <rect width="480" height="220" fill="#0d1b2e"/>

  <!-- TV screen frame -->
  <rect x="30" y="18" width="240" height="160" rx="12" fill="#1a2a40" stroke="#3a5a80" stroke-width="3"/>
  <rect x="38" y="26" width="224" height="144" rx="8" fill="#0a3020"/>

  <!-- Reversi board on screen (6x6 grid) -->
  <rect x="50" y="33" width="196" height="130" rx="4" fill="#0d5530"/>

  <!-- Grid lines -->
  <g stroke="#0a4025" stroke-width="1">
    <line x1="83"  y1="33" x2="83"  y2="163"/>
    <line x1="116" y1="33" x2="116" y2="163"/>
    <line x1="149" y1="33" x2="149" y2="163"/>
    <line x1="182" y1="33" x2="182" y2="163"/>
    <line x1="50"  y1="55" x2="246" y2="55"/>
    <line x1="50"  y1="77" x2="246" y2="77"/>
    <line x1="50"  y1="99" x2="246" y2="99"/>
    <line x1="50"  y1="121" x2="246" y2="121"/>
    <line x1="50"  y1="143" x2="246" y2="143"/>
  </g>

  <!-- Corner dots -->
  <circle cx="116" cy="77" r="3" fill="#0a4025"/>
  <circle cx="182" cy="77" r="3" fill="#0a4025"/>
  <circle cx="116" cy="121" r="3" fill="#0a4025"/>
  <circle cx="182" cy="121" r="3" fill="#0a4025"/>

  <!-- Pieces -->
  <!-- Black -->
  <circle cx="148" cy="99"  r="13" fill="#111" stroke="#333" stroke-width="1"/>
  <circle cx="182" cy="121" r="13" fill="#111" stroke="#333" stroke-width="1"/>
  <circle cx="116" cy="55"  r="13" fill="#111" stroke="#333" stroke-width="1"/>
  <circle cx="83"  cy="121" r="13" fill="#111" stroke="#333" stroke-width="1"/>
  <circle cx="215" cy="77"  r="13" fill="#111" stroke="#333" stroke-width="1"/>

  <!-- White -->
  <circle cx="182" cy="99"  r="13" fill="white" stroke="#ccc" stroke-width="1"/>
  <circle cx="148" cy="121" r="13" fill="white" stroke="#ccc" stroke-width="1"/>
  <circle cx="182" cy="55"  r="13" fill="white" stroke="#ccc" stroke-width="1"/>
  <circle cx="116" cy="121" r="13" fill="white" stroke="#ccc" stroke-width="1"/>
  <circle cx="83"  cy="77"  r="13" fill="white" stroke="#ccc" stroke-width="1"/>

  <!-- Flipping piece -->
  <ellipse cx="116" cy="99" rx="13" ry="5" fill="#111" stroke="#444" stroke-width="1" opacity="0.9"/>

  <!-- Score on screen -->
  <rect x="50" y="155" width="90" height="18" rx="4" fill="#111" opacity="0.7"/>
  <text x="95" y="167" text-anchor="middle" font-family="Helvetica" font-size="10" fill="white">⚫ 24  ⚪ 40</text>

  <!-- TV stand -->
  <rect x="118" y="178" width="24" height="14" rx="2" fill="#3a5a80"/>
  <rect x="100" y="190" width="60" height="8" rx="4" fill="#3a5a80"/>

  <!-- Phone with QR -->
  <rect x="255" y="55" width="38" height="72" rx="6" fill="#1a2a40" stroke="#3a5a80" stroke-width="2"/>
  <rect x="259" y="61" width="30" height="54" rx="3" fill="#0a2040"/>
  <rect x="263" y="65" width="22" height="22" rx="2" fill="white"/>
  <rect x="265" y="67" width="6" height="6" fill="#111"/>
  <rect x="277" y="67" width="6" height="6" fill="#111"/>
  <rect x="265" y="79" width="6" height="6" fill="#111"/>
  <rect x="271" y="71" width="2" height="2" fill="#111"/>
  <rect x="275" y="75" width="2" height="2" fill="#111"/>
  <rect x="277" y="79" width="6" height="6" fill="#111"/>
  <text x="274" y="100" text-anchor="middle" font-family="Helvetica" font-size="7" fill="#aaddff">SCAN</text>
  <text x="274" y="109" text-anchor="middle" font-family="Helvetica" font-size="7" fill="#aaddff">TO PLAY</text>
  <rect x="265" y="118" width="18" height="5" rx="2.5" fill="#3a5a80"/>

  <!-- Right decorative panel -->
  <rect x="296" y="20" width="154" height="180" rx="8" fill="#ffffff" opacity="0.04"/>

  <!-- Big flip animation hint -->
  <circle cx="373" cy="100" r="50" fill="none" stroke="#1a7a1a" stroke-width="2" opacity="0.2"/>
  <circle cx="349" cy="100" r="22" fill="#111" stroke="#333" stroke-width="1.5" opacity="0.8"/>
  <ellipse cx="397" cy="100" rx="22" ry="8" fill="white" stroke="#ccc" stroke-width="1.5" opacity="0.8"/>
  <!-- Flip arrow -->
  <path d="M 362 88 Q 373 78 384 88" stroke="#ffd700" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <polygon points="384,84 388,90 380,90" fill="#ffd700"/>

  <!-- Title badge -->
  <rect x="305" y="155" width="140" height="32" rx="8" fill="#1a7a1a"/>
  <text x="375" y="168" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="white">TV REVERSI</text>
  <text x="375" y="180" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="white" opacity="0.8">2 PLAYERS</text>
</svg>
