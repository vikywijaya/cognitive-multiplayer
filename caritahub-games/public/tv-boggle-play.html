<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <title>TV Boggle - Word Hunt</title>
  <style>
    /* ── Mobile Boggle Player — Senior-Accessible ── */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f0f4f8;
      color: #222;
      -webkit-text-size-adjust: 100%;
      overflow: hidden;
    }

    .screen { display: none; height: 100dvh; min-height: 100vh; }
    .screen.active { display: flex; flex-direction: column; }

    /* ── Join Screen ── */
    .join-screen {
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      gap: 20px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
    }

    .join-title {
      font-size: 32px;
      font-weight: 800;
      text-align: center;
    }

    .join-subtitle {
      font-size: 18px;
      color: #aab;
      text-align: center;
    }

    .join-input {
      width: 100%;
      max-width: 400px;
      font-size: 24px;
      padding: 16px 20px;
      border: 3px solid #4ecca3;
      border-radius: 12px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      text-align: center;
      outline: none;
    }
    .join-input::placeholder { color: #889; }
    .join-input:focus { border-color: #ffd700; background: rgba(255,255,255,0.15); }

    .join-btn {
      width: 100%;
      max-width: 400px;
      font-size: 22px;
      font-weight: 700;
      padding: 18px;
      background: #4ecca3;
      color: #1a1a2e;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      letter-spacing: 0.03em;
      touch-action: manipulation;
    }
    .join-btn:disabled { background: #445; color: #889; cursor: not-allowed; }
    .join-btn:active:not(:disabled) { transform: scale(0.98); }

    .join-error {
      font-size: 16px;
      color: #ff6b6b;
      text-align: center;
      min-height: 24px;
    }

    /* ── Waiting Screen ── */
    .waiting-screen {
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      gap: 16px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
    }

    .waiting-title {
      font-size: 24px;
      font-weight: 700;
      text-align: center;
    }

    .waiting-name {
      font-size: 20px;
      color: #4ecca3;
      font-weight: 600;
    }

    .waiting-dots {
      font-size: 28px;
      animation: dotPulse 1.5s ease-in-out infinite;
    }

    @keyframes dotPulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .waiting-players {
      margin-top: 20px;
      width: 100%;
      max-width: 400px;
    }

    .waiting-players-title {
      font-size: 16px;
      color: #aab;
      margin-bottom: 8px;
    }

    .waiting-player-item {
      font-size: 18px;
      padding: 8px 16px;
      background: rgba(255,255,255,0.08);
      border-radius: 8px;
      margin-bottom: 6px;
    }

    /* ── Playing Screen ── */
    .playing-screen {
      background: #f0f4f8;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Timer — full-width top bar */
    .timer-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      background: #1a1a2e;
      color: #fff;
      flex-shrink: 0;
    }

    .timer-icon { font-size: 20px; }

    .timer-text {
      font-size: 26px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #ffd700;
    }

    .timer-bar.urgent .timer-text {
      color: #ff6b6b;
      animation: timerPulse 0.5s ease-in-out infinite alternate;
    }

    @keyframes timerPulse {
      from { opacity: 1; }
      to { opacity: 0.5; }
    }

    /* Two-column main area */
    .play-columns {
      flex: 1;
      display: flex;
      overflow: hidden;
      gap: 0;
    }

    /* Left column — input + submit + feedback */
    .play-left {
      flex: 0 0 55%;
      display: flex;
      flex-direction: column;
      padding: 12px 8px 12px 12px;
      gap: 10px;
      border-right: 2px solid #dde3ec;
    }

    .word-input {
      width: 100%;
      font-size: 24px;
      font-weight: 700;
      padding: 12px 14px;
      border: 3px solid #4ecca3;
      border-radius: 12px;
      background: #fff;
      color: #222;
      outline: none;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-align: center;
    }
    .word-input::placeholder {
      color: #bbb;
      text-transform: none;
      font-weight: 400;
      letter-spacing: normal;
      font-size: 18px;
    }
    .word-input:focus { border-color: #ffd700; box-shadow: 0 0 0 3px rgba(255,215,0,0.2); }

    .word-input.reject-flash {
      border-color: #ff6b6b;
      background: #fff0f0;
      box-shadow: 0 0 0 3px rgba(255,107,107,0.2);
    }

    .submit-btn {
      width: 100%;
      font-size: 20px;
      font-weight: 800;
      padding: 16px;
      background: #4ecca3;
      color: #1a1a2e;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      letter-spacing: 0.05em;
      touch-action: manipulation;
    }
    .submit-btn:active { transform: scale(0.98); background: #38b89a; }

    .reject-msg {
      font-size: 13px;
      color: #ff6b6b;
      font-weight: 600;
      text-align: center;
      min-height: 18px;
      transition: opacity 0.3s;
    }

    /* Right column — word count + found words */
    .play-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px 12px 12px 10px;
      overflow: hidden;
    }

    .word-count {
      font-size: 14px;
      font-weight: 700;
      color: #555;
      text-align: center;
      padding-bottom: 8px;
      border-bottom: 2px solid #dde3ec;
      flex-shrink: 0;
    }

    .word-count span {
      color: #4ecca3;
      font-size: 22px;
      font-weight: 900;
      display: block;
      line-height: 1.1;
    }

    /* Words list */
    .words-list-section {
      flex: 1;
      overflow-y: auto;
      margin-top: 8px;
      -webkit-overflow-scrolling: touch;
    }

    .words-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .word-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      background: #e8f8f0;
      color: #2d6a4f;
      border: 1px solid #b7e4cc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .word-chip .check { color: #4ecca3; flex-shrink: 0; }

    /* ── Results Screen ── */
    .results-screen {
      align-items: center;
      padding: 30px 20px;
      gap: 16px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      overflow-y: auto;
    }

    .results-title {
      font-size: 28px;
      font-weight: 800;
      color: #ffd700;
      text-align: center;
    }

    .results-rank {
      font-size: 22px;
      font-weight: 700;
      color: #4ecca3;
    }

    .results-score {
      font-size: 64px;
      font-weight: 900;
      color: #ffd700;
      line-height: 1;
    }

    .results-score-label {
      font-size: 16px;
      color: #aab;
    }

    .results-words-section {
      width: 100%;
      max-width: 400px;
      background: rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 16px;
    }

    .results-words-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #fff;
    }

    .results-word-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      font-size: 18px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .results-word-item:last-child { border-bottom: none; }

    .results-word-text {
      text-transform: uppercase;
      font-weight: 600;
    }

    .results-word-text.unique { color: #4ecca3; }

    .results-word-text.duplicate {
      color: #889;
      text-decoration: line-through;
    }

    .results-word-pts {
      font-weight: 700;
      font-size: 16px;
    }

    .results-word-pts.scored { color: #ffd700; }
    .results-word-pts.zero { color: #666; }

    .results-others-section {
      width: 100%;
      max-width: 400px;
    }

    .results-others-title {
      font-size: 16px;
      color: #aab;
      margin-bottom: 8px;
    }

    .results-other-player {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: rgba(255,255,255,0.06);
      border-radius: 8px;
      margin-bottom: 6px;
      font-size: 18px;
    }

    .results-other-name { font-weight: 600; }
    .results-other-score { font-weight: 800; color: #ffd700; }

    /* ── Game Over Screen ── */
    .gameover-screen {
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      gap: 16px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
    }

    .gameover-emoji { font-size: 80px; }

    .gameover-title {
      font-size: 48px;
      font-weight: 900;
      color: #ffd700;
    }

    .gameover-msg {
      font-size: 22px;
      font-weight: 600;
      text-align: center;
      max-width: 350px;
    }

    .gameover-personal {
      font-size: 28px;
      font-weight: 800;
      color: #4ecca3;
      text-align: center;
    }

    /* ── Reconnect ── */
    .reconnect-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #fff;
      z-index: 100;
    }

    /* ── Confetti ── */
    .confetti-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 99;
      overflow: hidden;
    }
    .confetti-piece {
      position: absolute;
      width: 10px;
      height: 10px;
      top: -10px;
      opacity: 0;
      animation: confettiFall 3s ease-in forwards;
    }
    @keyframes confettiFall {
      0% { opacity: 1; top: -10px; transform: rotate(0deg) scale(1); }
      100% { opacity: 0; top: 110vh; transform: rotate(720deg) scale(0.5); }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- ── Join Screen ── -->
  <div id="joinScreen" class="screen join-screen active">
    <div class="join-title">TV Boggle</div>
    <div class="join-subtitle">Word Hunt</div>
    <input id="nameInput" class="join-input" type="text" placeholder="Your Name" maxlength="30"
      autocomplete="off" autocorrect="off" spellcheck="false" />
    <button id="joinBtn" class="join-btn">Join Game</button>
    <div id="joinError" class="join-error"></div>
  </div>

  <!-- ── Waiting Screen ── -->
  <div id="waitingScreen" class="screen waiting-screen">
    <div class="waiting-title">Waiting for game to start</div>
    <div class="waiting-dots">...</div>
    <div id="waitingName" class="waiting-name"></div>
    <div class="waiting-players">
      <div class="waiting-players-title">Players in game:</div>
      <div id="waitingPlayerList"></div>
    </div>
  </div>

  <!-- ── Playing Screen ── -->
  <div id="playingScreen" class="screen playing-screen">
    <div class="timer-bar" id="timerBar">
      <span class="timer-icon">&#9202;</span>
      <span class="timer-text" id="timerText">2:00</span>
    </div>

    <div class="play-columns">
      <!-- Left: input + submit + feedback -->
      <div class="play-left">
        <input id="wordInput" class="word-input" type="text" placeholder="Type a word…"
          autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"
          inputmode="text" enterkeyhint="send" />
        <button id="submitBtn" class="submit-btn">SUBMIT</button>
        <div id="rejectMsg" class="reject-msg"></div>
      </div>

      <!-- Right: word count + found words -->
      <div class="play-right">
        <div class="word-count" id="wordCount">
          <span>0</span> words
        </div>
        <div class="words-list-section">
          <div class="words-list" id="wordsList"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Results Screen ── -->
  <div id="resultsScreen" class="screen results-screen">
    <div class="results-title">Round Over!</div>
    <div id="resultsRank" class="results-rank"></div>
    <div id="resultsScore" class="results-score">0</div>
    <div class="results-score-label">points</div>
    <div id="resultsWordsSection" class="results-words-section">
      <div class="results-words-title">Your Words</div>
      <div id="resultsWordsList"></div>
    </div>
    <div id="resultsOthersSection" class="results-others-section">
      <div class="results-others-title">Other Players</div>
      <div id="resultsOthersList"></div>
    </div>
  </div>

  <!-- ── Game Over Screen ── -->
  <div id="gameoverScreen" class="screen gameover-screen">
    <div id="gameoverEmoji" class="gameover-emoji"></div>
    <div id="gameoverTitle" class="gameover-title">Game Over</div>
    <div id="gameoverPersonal" class="gameover-personal"></div>
    <div id="gameoverMsg" class="gameover-msg"></div>
  </div>

  <!-- ── Confetti Container ── -->
  <div id="confettiContainer" class="confetti-container hidden"></div>

  <!-- ── Reconnect Overlay ── -->
  <div id="reconnectOverlay" class="reconnect-overlay hidden">
    Connection lost. Reconnecting...
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/tv-boggle-play.js"></script>
</body>
</html>
