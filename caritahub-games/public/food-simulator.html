<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Singapore Food Simulator</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="app">
    <header>
      <div class="header-inner">
        <div class="header-nav"><a href="/" class="back-link">← All Games</a></div>
        <h1>🍜 Food Simulator</h1>
        <p class="subtitle">Singapore Hawker Nutrition Tracker</p>
      </div>
    </header>

    <main id="foodApp">

      <!-- Slot Tabs -->
      <div class="card food-slot-tabs" id="foodSlotTabs"></div>

      <!-- Meal Selector -->
      <div class="card" id="foodSelectorCard">
        <div class="food-category-row" id="foodCategoryRow"></div>
        <div class="food-meal-grid" id="foodMealGrid"></div>
      </div>

      <!-- Today's Tray -->
      <div class="card" id="foodTrayCard">
        <div class="food-section-title">🧺 Today's Tray</div>
        <div id="foodTray"></div>
      </div>

      <!-- Nutrition Summary -->
      <div class="card" id="foodSummaryCard">
        <div class="food-section-title">📊 Daily Nutrition vs MOH Guidelines</div>
        <div class="food-cal-hero">
          <span class="food-cal-hero-num" id="foodCalHero">0</span>
          <span class="food-cal-hero-unit">kcal</span>
          <span class="food-cal-hero-limit">/ 2,000 kcal daily</span>
        </div>
        <div id="foodSummaryBars"></div>
        <div class="food-moh-note">
          Based on Singapore Health Promotion Board (HPB) guidelines for an average adult.<br>
          Individual needs vary by age, sex, and activity level.
        </div>
      </div>

      <!-- Education Panel -->
      <div class="card" id="foodEduCard">
        <button class="food-edu-toggle" id="foodEduToggle">
          <span id="foodEduArrow">▶</span> Nutrition Tips &amp; Insights
        </button>
        <div id="foodEduBody" class="hidden"></div>
      </div>

      <!-- Actions -->
      <div class="food-actions">
        <button class="btn btn-secondary" id="foodResetBtn">Clear All</button>
      </div>

    </main>
  </div>

  <script src="/js/food-simulator.js"></script>
</body>
</html>
